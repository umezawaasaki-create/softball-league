<main>
  <!-- ===== STANDINGS TAB ===== -->
  <div class="tab-panel active" id="tab-standings">
    <div class="section-title">順位表</div>
    <div class="standings-wrap">
      <table class="standings-table">
        <thead>
          <tr>
            <th>順位</th>
            <th>チーム</th>
            <th>試合</th>
            <th>勝</th>
            <th>負</th>
            <th>引分</th>
            <th>未</th>
            <th>勝率</th>
            <th>得点</th>
            <th>失点</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
    <div class="section-title">全試合 進捗</div>
    <div id="progress-info" style="font-size:13px; color:var(--gray); margin-bottom:10px;"></div>
    <div id="standings-rules"></div>
  </div>

  <!-- ===== MATRIX TAB ===== -->
  <div class="tab-panel" id="tab-matrix">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>勝ち</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>負け</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>引分</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--gray)"></div>未実施</div>
    </div>
    <div class="matrix-wrap">
      <table class="matrix-table" id="matrix-table"></table>
    </div>
    <p style="font-size:12px; color:var(--gray); margin-top:8px;">※ 縦＝ホーム（自チーム）、横＝アウェイ（相手チーム）。各カードに2試合分の結果が入ります。</p>
  </div>

  <!-- ===== GROUNDS TAB ===== -->
  <div class="tab-panel" id="tab-grounds">
    <div class="ground-header">
      <div class="section-title" style="margin-bottom:0">グランド情報・対戦募集</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <select id="ground-sort" onchange="renderGrounds()" style="background:#f8fafc;border:1px solid var(--border);border-radius:7px;color:#1f2937;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;padding:7px 12px;outline:none;cursor:pointer;">
          <option value="date">📅 日付順</option>
          <option value="name">🏟 グランド順</option>
          <option value="created">🕐 募集開始順</option>
        </select>
        <button class="btn-add-ground" onclick="openGroundModal()">＋ グランドを登録する</button>
      </div>
    </div>
    <div class="ground-grid" id="ground-grid">
      <div class="no-ground">まだグランドが登録されていません。<br>上のボタンから登録してください。</div>
    </div>
  </div>

  <!-- ===== SCHEDULE TAB ===== -->
  <div class="tab-panel" id="tab-schedule">
    <div class="section-title">対戦予定</div>
    <div id="schedule-list"></div>
  </div>

  <!-- ===== RESULTS LIST TAB ===== -->
  <div class="tab-panel" id="tab-results-list">
    <div class="section-title">対戦結果</div>
    <div id="results-list"></div>
  </div>
</main>

<!-- ===== RESULT INPUT MODAL ===== -->
<div class="modal-overlay" id="result-modal">
  <div class="modal" style="max-width:480px;">
    <h3>試合結果を入力</h3>
    <div class="modal-subtitle" id="modal-pair-label"></div>
    <div id="games-container"></div>
    <div class="modal-actions">
      <button class="btn-delete" onclick="clearResults()" id="btn-clear" style="display:none">クリア</button>
      <button class="btn-cancel" onclick="closeModal('result-modal')">キャンセル</button>
      <button class="btn-save" onclick="saveResults()">保存する</button>
    </div>
  </div>
</div>

<!-- ===== GROUND DETAIL MODAL ===== -->

    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn-cancel" onclick="closeModal('ground-detail-modal')">閉じる</button>
    </div>
  </div>
</div>

<!-- ===== APPLY MODAL ===== -->
<div class="modal-overlay" id="apply-modal">
  <div class="modal" style="max-width:420px;">
    <h3>対戦を申し込む</h3>
    <div class="modal-subtitle" id="apply-modal-subtitle"></div>
    <div class="field-group" style="margin-top:16px;">
      <label class="field-label">申込チーム</label>
      <select id="apply-team" style="width:100%;background:#f8fafc;border:1px solid var(--border);border-radius:7px;color:#1f2937;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;padding:9px 12px;outline:none;">
        <option value="">選択してください</option>
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">メッセージ（任意）</label>
      <textarea id="apply-message" placeholder="例：よろしくお願いします。当日は10名で参加予定です。" style="width:100%;background:#f8fafc;border:1px solid var(--border);border-radius:7px;color:#1f2937;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;padding:9px 12px;outline:none;resize:vertical;min-height:80px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('apply-modal')">キャンセル</button>
      <button class="btn-save" onclick="submitApply()">申し込む</button>
    </div>
  </div>
</div>

<!-- ===== APPLICATION LIST MODAL ===== -->
<div class="modal-overlay" id="applist-modal">

    <div class="modal-subtitle" id="applist-subtitle"></div>
    <div id="applist-container" style="margin-top:16px;max-height:360px;overflow-y:auto;"></div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn-cancel" onclick="closeModal('applist-modal')">閉じる</button>
    </div>
  </div>
</div>

<!-- ===== GROUND INPUT MODAL ===== -->
<div class="modal-overlay" id="ground-modal">
  <div class="modal ground-modal">
    <h3>グランドを登録する</h3>
    <div class="modal-subtitle">情報を入力して対戦を募集できます</div>
    <div class="field-group">
      <label class="field-label">チーム名</label>
      <div class="field-row" style="margin-bottom:0">
        <select id="g-team" style="flex:1">
          <option value="">選択してください</option>
        </select>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">グランド名</label>
      <div class="field-row" style="margin-bottom:0">
        <input type="text" id="g-name" placeholder="例：砧公園グランド">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">使用可能日</label>
      <div class="field-row" style="margin-bottom:0">
        <input type="date" id="g-date-picker" style="flex:1;background:#f8fafc;border:1px solid var(--border);border-radius:7px;color:#1f2937;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;padding:9px 12px;outline:none;" onchange="updateGDateDisplay()">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">開始〜終了時刻</label>
      <div class="field-row" style="margin-bottom:0;gap:8px;">
        <input type="time" id="g-time-start" style="flex:1;background:#f8fafc;border:1px solid var(--border);border-radius:7px;color:#1f2937;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;padding:9px 12px;outline:none;" onchange="updateGDateDisplay()">
        <span style="color:var(--gray);align-self:center;">〜</span>
        <input type="time" id="g-time-end" style="flex:1;background:#f8fafc;border:1px solid var(--border);border-radius:7px;color:#1f2937;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;padding:9px 12px;outline:none;" onchange="updateGDateDisplay()">
      </div>
    </div>
    <div id="g-date-preview" style="font-size:12px;color:var(--green);margin-top:-8px;margin-bottom:4px;min-height:18px;"></div>
    <div class="field-group">
      <label class="field-label">場所・アクセス</label>
      <div class="field-row" style="margin-bottom:0">
        <input type="text" id="g-location" placeholder="例：世田谷区砧公園 第3グランド">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">連絡先・備考</label>
      <textarea id="g-note" placeholder="例：対戦相手を募集中。連絡は xxxxxx@xxx.com まで。収容可能人数：20名程度"></textarea>
    </div>
    <div id="ground-modal-extra" style="display:none;margin-bottom:4px;">
      <button id="btn-toggle-recruit" onclick="toggleRecruitInModal()" style="width:100%;background:rgba(245,197,24,0.12);color:var(--yellow);border:1px solid rgba(245,197,24,0.35);border-radius:8px;padding:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;"></button>
    </div>
    <div class="modal-actions">
      <button id="btn-delete-ground" class="btn-delete" onclick="deleteGroundFromModal()" style="display:none;">登録を削除</button>
      <button class="btn-cancel" onclick="closeModal('ground-modal')">キャンセル</button>
      <button class="btn-save" onclick="saveGround()">登録する</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
